name: ESP32-P4 Firmware CI

on:
  push:
    paths:
      - "core/**"
      - "firmware/esp32p4/**"
      - "boards/waveshare-esp32-p4-wifi6-touch-lcd-4b/**"
      - ".github/workflows/esp32p4-ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "firmware/esp32p4/**"
      - "boards/waveshare-esp32-p4-wifi6-touch-lcd-4b/**"
      - ".github/workflows/esp32p4-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP32-P4 bootstrap with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32p4
          path: firmware/esp32p4
          command: idf.py build

      - name: Collect flash package
        shell: bash
        run: |
          set -euo pipefail
          package="firmware/esp32p4/artifact"
          build="firmware/esp32p4/build"

          test -s "$build/deos_esp32p4.bin"
          test -s "$build/bootloader/bootloader.bin"
          test -s "$build/partition_table/partition-table.bin"
          test -s "$build/flash_args"
          test -s "$build/flasher_args.json"

          rm -rf "$package"
          mkdir -p "$package/bootloader" "$package/partition_table"

          cp "$build/deos_esp32p4.bin" "$package/"
          cp "$build/bootloader/bootloader.bin" "$package/bootloader/"
          cp "$build/partition_table/partition-table.bin" "$package/partition_table/"
          cp "$build/flash_args" "$package/"
          cp "$build/flasher_args.json" "$package/"

          {
            echo "DEOS ESP32-P4 CI flash package"
            echo "commit=$GITHUB_SHA"
            echo "idf=6.1"
            echo "target=esp32p4"
            echo
            echo "Flash from this directory with ESP-IDF 6.1 active:"
            echo 'python -m esptool --chip esp32p4 -b 460800 --before default-reset --after hard-reset write-flash "@flash_args"'
          } > "$package/BUILD_INFO.txt"

          (
            cd "$package"
            sha256sum               deos_esp32p4.bin               bootloader/bootloader.bin               partition_table/partition-table.bin               flash_args               flasher_args.json > SHA256SUMS
          )

      - name: Upload ESP32-P4 flash package
        uses: actions/upload-artifact@v4
        with:
          name: deos-esp32p4-idf61
          path: firmware/esp32p4/artifact/
          if-no-files-found: error
          retention-days: 30
