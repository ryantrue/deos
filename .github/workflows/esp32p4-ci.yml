name: ESP32-P4 Firmware CI

on:
  push:
    paths:
      - "core/**"
      - "firmware/esp32p4/**"
      - "boards/waveshare-esp32-p4-wifi6-touch-lcd-4b/**"
      - ".github/workflows/esp32p4-ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "firmware/esp32p4/**"
      - "boards/waveshare-esp32-p4-wifi6-touch-lcd-4b/**"
      - ".github/workflows/esp32p4-ci.yml"


permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP32-P4 bootstrap with ESP-IDF 6.1
        env:
          DEOS_DEV_WIFI_SSID: ${{ secrets.DEOS_DEV_WIFI_SSID }}
          DEOS_DEV_WIFI_PASSWORD: ${{ secrets.DEOS_DEV_WIFI_PASSWORD }}
          DEOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32p4
          path: firmware/esp32p4
          command: idf.py build

      - name: Verify hardware-critical runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          config="firmware/esp32p4/sdkconfig"
          grep -qx 'CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM=y' "$config"
          grep -qx 'CONFIG_FREERTOS_HZ=1000' "$config"
          grep -qx 'CONFIG_COMPILER_OPTIMIZATION_PERF=y' "$config"
          grep -qx 'CONFIG_LV_OS_FREERTOS=y' "$config"
          grep -qx 'CONFIG_LV_DRAW_THREAD_PRIO=2' "$config"

      - name: Verify local-only configuration policy
        shell: bash
        run: |
          set -euo pipefail
          firmware="firmware/esp32p4/main"
          ! grep -R -E 'WIFI_MODE_AP|WIFI_IF_AP|create_default_wifi_ap|DEOS-SETUP' "$firmware"
          ! grep -R -F 'uri = "/setup"' "$firmware"
          grep -Fq 'impl_->go_home();' "$firmware/ui_shell.cpp"

      - name: Verify display, touch and shell integration policy
        shell: bash
        run: |
          set -euo pipefail
          firmware="firmware/esp32p4/main"
          display="$firmware/display_controller.cpp"
          touch="$firmware/touch_controller.cpp"
          shell="$firmware/ui_shell.cpp"
          widgets="$firmware/ui_widgets.cpp"
          home="$firmware/ui_home_screen.cpp"

          grep -Fq 'dpi.num_fbs = 2;' "$display"
          grep -Fq 'heap_caps_aligned_calloc' "$display"
          grep -Fq 'MALLOC_CAP_SPIRAM' "$display"
          grep -Fq 'LV_DISPLAY_RENDER_MODE_PARTIAL' "$display"
          ! grep -Fq 'esp_lcd_dpi_panel_get_frame_buffer' "$display"
          ! grep -Fq 'LV_DISPLAY_RENDER_MODE_FULL' "$display"
          ! grep -Fq 'LV_DISPLAY_RENDER_MODE_DIRECT' "$display"

          grep -Fq 'data->point.x = self->last_x;' "$touch"
          grep -Fq 'data->point.y = self->last_y;' "$touch"

          ! grep -Fq 'label(screen, "DEOS"' "$shell"
          grep -Fq '{"HOME", "CONTROL", "APPS", "SETTINGS"}' "$home"
          grep -Fq 'lv_obj_set_style_transform_scale' "$widgets"
          grep -Fq '"screen: %s"' "$shell"

      - name: Collect flash package
        shell: bash
        env:
          DEOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          package="firmware/esp32p4/artifact"
          build="firmware/esp32p4/build"

          test -s "$build/deos_esp32p4.bin"
          test -s "$build/flash_args"
          test -s "$build/flasher_args.json"

          rm -rf "$package"
          mkdir -p "$package"

          BUILD_DIR="$build" PACKAGE_DIR="$package" python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil

          build = pathlib.Path(os.environ["BUILD_DIR"])
          package = pathlib.Path(os.environ["PACKAGE_DIR"])
          args = json.loads((build / "flasher_args.json").read_text())

          flash_files = args.get("flash_files", {})
          if not flash_files:
              raise SystemExit("flasher_args.json has no flash_files")

          for offset, relative in flash_files.items():
              src = build / relative
              if not src.is_file() or src.stat().st_size == 0:
                  raise SystemExit(f"missing flash image {relative} for {offset}")
              dst = package / relative
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              print(f"{offset}: {relative} ({src.stat().st_size} bytes)")

          shutil.copy2(build / "flash_args", package / "flash_args")
          shutil.copy2(build / "flasher_args.json", package / "flasher_args.json")
          PY

          cp "firmware/esp32p4/partitions.csv" "$package/partitions.csv"
          cp "firmware/esp32p4/sdkconfig" "$package/sdkconfig"
          cp "$build/deos_esp32p4.elf" "$package/deos_esp32p4.elf"
          cp "$build/deos_esp32p4.map" "$package/deos_esp32p4.map"

          {
            echo "DEOS ESP32-P4 CI flash package"
            echo "source_commit=$DEOS_SOURCE_SHA"
            echo "tested_commit=$GITHUB_SHA"
            echo "idf=6.1"
            echo "target=esp32p4"
            echo "optimization=performance"
            echo
            echo "First migration to the A/B layout:"
            echo 'python -m esptool --chip esp32p4 -p "$PORT" erase-flash'
            echo 'python -m esptool --chip esp32p4 -p "$PORT" -b 460800 --before default-reset --after hard-reset write-flash "@flash_args"'
            echo
            echo "Later OTA updates upload only deos_esp32p4.bin."
          } > "$package/BUILD_INFO.txt"

          (
            cd "$package"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 shasum -a 256 > SHA256SUMS
          )

      - name: Upload ESP32-P4 flash package
        uses: actions/upload-artifact@v4
        with:
          name: deos-esp32p4-idf61
          path: firmware/esp32p4/artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Publish temporary dev OTA channel
        if: github.event_name == 'push' && github.ref_name == 'refactor/p4-ui-foundation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEOS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="firmware/esp32p4/build/deos_esp32p4.bin"
          manifest="firmware/esp32p4/artifact/dev-ota.json"
          test -s "$image"
          sha256="$(shasum -a 256 "$image" | awk '{print $1}')"
          printf '{"source_commit":"%s","sha256":"%s","url":"https://github.com/ryantrue/deos/releases/download/dev-p4-latest/deos_esp32p4.bin"}\n'             "$DEOS_SOURCE_SHA" "$sha256" > "$manifest"

          gh release delete dev-p4-latest --cleanup-tag -y || true
          gh release create dev-p4-latest             --target "$DEOS_SOURCE_SHA"             --title "DEOS ESP32-P4 temporary dev OTA"             --notes "Temporary automatic OTA channel for refactor/p4-ui-foundation."             --prerelease             "$image#deos_esp32p4.bin"             "$manifest#dev-ota.json"
